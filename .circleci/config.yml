---
version: 2.1

docker_auth: &docker_auth
  username: $DOCKERHUB_USERNAME
  password: $DOCKERHUB_PASSWORD

defaults: &defaults
  docker:
    - image: greenpeaceinternational/circleci-base:latest
      auth:
        <<: *docker_auth
  working_directory: /home/circleci/app

jobs:
  lint:
    <<: *defaults
    environment:
      GOOGLE_PROJECT_ID: planet4-production
    steps:
      - setup_remote_docker
      - checkout
      - run: make -C deploy checkout
      - run: make -C deploy lint

  deploy-dev:
    <<: *defaults
    environment:
      GOOGLE_PROJECT_ID: planet4-production
    steps:
      - setup_remote_docker
      - checkout
      - run: activate-gcloud-account.sh
      - run: docker-login.sh
      - run: make -C deploy checkout
      - run: make -C deploy commit
      - run: make -C deploy docker-build
      - run: make -C deploy docker-push
      - run: make -C deploy dev

  deploy-tag:
    <<: *defaults
    environment:
      GOOGLE_PROJECT_ID: planet4-production
    steps:
      - setup_remote_docker
      - checkout
      - run: activate-gcloud-account.sh
      - run: docker-login.sh
      - run: make -C deploy checkout
      - run: make -C deploy tag
      - run: make -C deploy docker-build
      - run: make -C deploy docker-push
      - run:
          command: make -C deploy prod
          no_output_timeout: 30m

  update-geoip:
    <<: *defaults
    environment:
      GOOGLE_PROJECT_ID: planet-4-151612
    steps:
      - checkout
      - run:
          name: Activate gcloud
          command: activate-gcloud-account.sh
      - run:
          name: Install geoipupdate
          command: |
            sudo apt-get update
            sudo apt-get install geoipupdate
      - run:
          name: Prepare GeoIP configuration
          command: |
            export GEOIP_ACCOUNTID="$(echo "$GEOIP_ACCOUNTID" | base64 --decode)"
            export GEOIP_LICENSE="$(echo "$GEOIP_LICENSE" | base64 --decode)"
            envsubst '$GEOIP_ACCOUNTID $GEOIP_LICENSE' < ./templates/etc/GeoIP.conf.tmpl | sudo tee /etc/GeoIP.conf > /dev/null
      - run:
          name: Update GeoIP database
          command: ./bin/geoipupdate.sh

workflows:
  branch:
    jobs:
      - lint:
          context: org-global
          filters:
            branches:
              ignore: main
            tags:
              ignore: /.*/

  dev:
    jobs:
      - deploy-dev:
          context: org-global
          filters:
            branches:
              only:
                - main
                - hostpath
  tag:
    jobs:
      - deploy-tag:
          context: org-global
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/

  weekly-geoip:
    triggers:
      - schedule:
          # Weekly 0900UTC Thu
          cron: "0 9 * * 4"
          filters:
            branches:
              only:
                - main
    jobs:
      - update-geoip:
          context: org-global
