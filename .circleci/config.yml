---
version: 2.1

defaults: &defaults
  docker:
    - image: greenpeaceinternational/circleci-base:latest
  working_directory: /home/circleci/app

jobs:
  lint:
    <<: *defaults
    environment:
      GOOGLE_PROJECT_ID: planet4-production
    steps:
      - setup_remote_docker
      - checkout
      - run: make -C deploy checkout
      - run: make -C deploy lint

  deploy-dev:
    <<: *defaults
    environment:
      GOOGLE_PROJECT_ID: planet4-production
    steps:
      - setup_remote_docker
      - checkout
      - run: activate-gcloud-account.sh
      - run: docker-login.sh
      - run: make -C deploy checkout
      - run: make -C deploy commit
      - run: make -C deploy docker-build
      - run: make -C deploy docker-push
      - run: make -C deploy dev

  deploy-tag:
    <<: *defaults
    environment:
      GOOGLE_PROJECT_ID: planet4-production
    steps:
      - setup_remote_docker
      - checkout
      - run: activate-gcloud-account.sh
      - run: docker-login.sh
      - run: make -C deploy checkout
      - run: make -C deploy tag
      - run: make -C deploy docker-build
      - run: make -C deploy docker-push
      - run:
          command: make -C deploy prod
          no_output_timeout: 30m

workflows:
  version: 2
  branch:
    jobs:
      - lint:
          context: org-global
          filters:
            branches:
              ignore: main
            tags:
              ignore: /.*/

  dev:
    jobs:
      - deploy-dev:
          context: org-global
          filters:
            branches:
              only: main
  tag:
    jobs:
      - deploy-tag:
          context: org-global
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
